query ShopQuery {
  me {
    score
    runs {
      remaining
    }
    bonus {
      win
    }
  }
  shop {
    products {
      id
      quantity
      period
      amount
      category
    }
  }
}

mutation ShopCreateInvoice($productId: ProductId!) {
  shop {
    createInvoice(productId: $productId)
  }
}
