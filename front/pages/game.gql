query GameGuessesQuery {
  game {
    guesses {
      id
      category
      name
      price
      image
      url
    }
  }
}

query GameQuery {
  me {
    score
    runs {
      remaining
    }
  }
}

mutation GameCommandWin {
  game {
    win
  }
}

mutation GameCommandLose {
  game {
    lose
  }
}
