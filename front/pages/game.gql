query GameGuessesQuery {
  game {
    guesses {
      id
      price
      displayed
      name
      image
      url
    }
  }
}

query GameQuery {
  me {
    score
    runs {
      remaining
    }
  }
}

mutation GameCommandLose($guessId: GuessId!) {
  game {
    lose(guessId: $guessId)
  }
}

mutation GameCommandGuess($guessId: GuessId!, $userGuess: UserGuess!) {
  game {
    guess(guessId: $guessId, userGuess: $userGuess)
  }
}
