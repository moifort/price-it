query GameGuessesQuery {
  game {
    guesses {
      id
      category
      name
      price
      image
      url
    }
  }
}

query GameQuery {
  me {
    score
    runs {
      remaining
    }
  }
}

mutation GameCommandWin($guessId: GuessId!) {
  game {
    win(guessId: $guessId)
  }
}

mutation GameCommandLose($guessId: GuessId!) {
  game {
    lose(guessId: $guessId)
  }
}
