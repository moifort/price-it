overwrite: true
schema: src/**/graphql/typedefs.ts
generates:
  src/api/__generated__/graphql.schema.json:
    plugins:
      - introspection
  src/api/__generated__/types.ts:
    plugins:
      - typescript
      - typescript-resolvers
      - add:
          content: '/* eslint-disable */'
      - add:
          content: '// @ts-nocheck'

    config:
      useTypeImports: true
      enumsAsTypes: true
      federation: true
      contextType: '../types#GraphQlContext'
#      resolverTypeWrapperSignature: 'PartialDeep<T> | Promise<PartialDeep<T>>'
#      enumValues:
#        KpiId: '../../kpi/index.type#KpiId'
#        Channel: '../../kpi/index.type#Channel'
#        Period: '../../kpi/index.type#Period'
#        Unit: '../../kpi/index.type#Unit'
#        OrderBy: '../../kpi/index.type#OrderBy'
#        CountryId: '../../country/index.type#CountryId'
#        Currency: 'FiatCurrency'
      scalars:
        Score: '../../score/types#Score'
        PlayerId: '../../player/types#PlayerId'
        Point: '../../score/types#Point'
        Minute: '../../utils/types#Minute'
        Seconde: '../../utils/types#Seconde'
        Limit: '../../utils/types#Limit'
        Percentage: '../../utils/types#Percentage'
        Amount: '../../utils/types#Amount'
        PercentagePoint: '../../utils/types#PercentagePoint'
        Url: '../../utils/types#Url'
        Run: '../../run/types#Run'
        ProductId: '../../product/types#ProductId'
        WalletId: '../../airdrop/types#WalletId'
        Date: 'Date'
